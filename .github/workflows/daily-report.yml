name: Daily automation status report

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-automation-report
  cancel-in-progress: false

jobs:
  email-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out report script
        uses: actions/checkout@v4

      - name: Send daily status report
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 scripts/daily_status_report.py
