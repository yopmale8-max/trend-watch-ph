name: Automated Programmatic SEO Engine

on:
  workflow_dispatch: # Publishing requires an intentional manual run.

permissions:
  contents: read

concurrency:
  group: trend-watch-publish
  cancel-in-progress: false

jobs:
  publishing-disabled:
    if: vars.ENABLE_AUTO_PUBLISH != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain publishing gate
        run: echo "Publishing is disabled. Set ENABLE_AUTO_PUBLISH to true only for an intentional, reviewed manual run."

  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install google-genai==2.34.0 feedparser==6.0.14

      - name: Run Offline Regression Tests
        env:
          GEMINI_API_KEY: test-only-not-a-real-key
        run: |
          python -m unittest discover -s tests -v

      - name: Run Trend Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN || 'fc522491c2a8443782bb9676eae89499' }}
          PYTHONUNBUFFERED: '1'
        run: |
          python generate_site.py

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --cached --quiet || git commit -m "Auto-generated live trend updates [skip ci]"
          git push