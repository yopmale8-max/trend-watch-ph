name: Automated Programmatic SEO Engine

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every four hours automatically.
  workflow_dispatch: # Allows an intentional manual run from GitHub Actions.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trend-watch-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install google-genai==2.34.0 feedparser==6.0.14

      - name: Run Offline Regression Tests
        env:
          GEMINI_API_KEY: test-only-not-a-real-key
        run: |
          python -m unittest discover -s tests -v

      - name: Run Trend Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: https://yopmale8-max.github.io/trend-watch-ph
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN || 'fc522491c2a8443782bb9676eae89499' }}
          PYTHONUNBUFFERED: '1'
        run: |
          python generate_site.py

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/pending_trends.json
          git diff --quiet && git diff --cached --quiet || git commit -m "Auto-generated live trend updates [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload article publishing metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendwatch-publish-status-${{ github.run_id }}
          path: data/publish_status.json
          if-no-files-found: warn
          retention-days: 7