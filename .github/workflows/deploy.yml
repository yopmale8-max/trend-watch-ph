name: Automated Programmatic SEO Engine

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours automatically
  workflow_dispatch: # Allows manual trigger from GitHub dashboard

permissions:
  contents: read

concurrency:
  group: trend-watch-publish
  cancel-in-progress: false

jobs:
  publishing-disabled:
    if: vars.ENABLE_AUTO_PUBLISH != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain publishing gate
        run: echo "Publishing is disabled. Set the repository Actions variable ENABLE_AUTO_PUBLISH to true only after reviewing the workflow and site configuration."

  build-and-deploy:
    if: vars.ENABLE_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install google-genai==2.34.0 feedparser==6.0.14

      - name: Run Trend Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python generate_site.py

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --cached --quiet || git commit -m "Auto-generated live trend updates [skip ci]"
          git push